const ids=['sensor.power','sensor.temperature','sensor.price','sensor.humidity'];const units=['W','°C','EUR/kWh','%'],values=[418,20.8,-0.04,54],names=['Stroomverbruik','Woonkamer','Stroomprijs','Luchtvochtigheid'];
