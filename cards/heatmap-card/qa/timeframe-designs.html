<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Periodekeuze — drie stijlvoorbeelden</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.5 system-ui,sans-serif;background:#15171c;color:var(--text);--surface:#22242b;--text:#e8e8ed;--muted:#a5a7b0;--line:#41444e;--button:#2c2f37;--accent:#81b9ff;color-scheme:dark}body.light{background:#f3f4f6;--surface:#fff;--text:#20252b;--muted:#626970;--line:#d4d9df;--button:#edf0f3;--accent:#2563eb;color-scheme:light}main{max-width:1100px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:22px}p{color:var(--muted)}button,input{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.theme{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 12px}.examples{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:24px}h2{font-size:16px;margin:0 0 6px}.description{min-height:60px;margin:0 0 16px;font-size:13px}.popup{padding:14px 12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0002;font-size:12px}.heading{font-size:14px;font-weight:600}.range{font-size:11px;color:var(--muted);margin:6px 0 12px;font-variant-numeric:tabular-nums}.default,.option,.apply{border:0;border-radius:5px;background:var(--button);min-height:34px;padding:7px 8px}.default{display:flex;align-items:center;justify-content:space-between;width:100%;margin-bottom:12px}.default span{color:inherit}.tabs{display:flex;gap:4px;align-items:flex-end;margin-bottom:12px}.tabs button{flex:1;min-width:0;min-height:36px;padding:8px 3px;font-size:12px;white-space:nowrap;border:0;background:transparent;color:var(--muted)}.tabs button[aria-selected=true]{color:var(--accent);font-weight:600}.options{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.calendar{grid-template-columns:repeat(3,minmax(0,1fr))}.option{position:relative;min-width:0;white-space:nowrap;padding:7px 3px;font-size:12px}.option[aria-pressed=true],.default[aria-pressed=true]{color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface));box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 55%,transparent)}.option[aria-pressed=true]::after{content:'✓';position:absolute;right:3px;top:0;font-size:9px}.default:hover,.option:hover,.apply:hover{background:color-mix(in srgb,var(--text) 12%,var(--surface))}.panel[hidden]{display:none}.panel label{display:grid;gap:4px;margin-bottom:10px}.panel input{width:100%;min-width:0;border:1px solid var(--line);border-radius:5px;padding:7px;background:var(--surface);font-size:12px}.apply{width:100%;margin-top:2px}.underline .tabs{border-bottom:1px solid var(--line);gap:8px}.underline .tabs button{border-bottom:2px solid transparent}.underline .tabs button[aria-selected=true]{border-bottom-color:var(--accent)}.underline .tabs button:hover{color:var(--text);background:color-mix(in srgb,var(--text) 5%,var(--surface))}.folder .tabs{border-bottom:1px solid var(--line);padding:0 2px}.folder .tabs button{border:1px solid transparent;border-bottom-color:var(--line);border-radius:6px 6px 0 0;margin-bottom:-1px}.folder .tabs button:hover{background:var(--button)}.folder .tabs button[aria-selected=true]{background:var(--surface);border-color:var(--line);border-bottom-color:var(--surface)}.folder .option{border:1px solid var(--line);background:transparent}.folder .option[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface));box-shadow:none}.segmented .tabs{padding:3px;gap:2px;border-radius:8px;background:var(--button)}.segmented .tabs button{border-radius:5px;min-height:32px}.segmented .tabs button[aria-selected=true]{background:var(--surface);box-shadow:0 1px 4px #0003}.segmented .option{border-radius:8px}.segmented .option[aria-pressed=true]{background:color-mix(in srgb,var(--accent) 18%,var(--surface));box-shadow:none}@media(max-width:900px){.examples{grid-template-columns:1fr;max-width:380px}.description{min-height:0}}@media(max-width:400px){body{padding:12px}.examples{gap:28px}}
</style>
</head>
<body><main>
<header><h1>Periodekeuze</h1><button class="theme" type="button">Licht / donker</button></header>
<p>Drie losse voorbeelden. Probeer de tabs en periodeknoppen; de kaarten zelf veranderen hierdoor niet.</p>
<div class="examples"></div>
</main>
<script>
const variants=[['underline','A · Rustige onderlijn','Tabs met een dunne actieve onderlijn. Neutrale knoppen met een zacht kleurvlak voor de gekozen periode.'],['folder','B · Klassieke tabbladen','Tabs sluiten aan op de inhoud. Fijn omlijnde periodeknoppen en een duidelijke selectierand.'],['segmented','C · Zachte schakelaar','Tabs in één afgeronde balk. De actieve tab ligt iets hoger; periodeknoppen hebben zachtere hoeken.']];
const rolling=[['1u','1 uur'],['6u','6 uur'],['12u','12 uur'],['24u','24 uur'],['48u','48 uur'],['7d','7 dagen'],['14d','14 dagen'],['30d','30 dagen'],['90d','90 dagen'],['365d','365 dagen']];
const calendar=['Vandaag','Deze week','Deze maand','Dit kwartaal','Dit jaar'];
document.querySelector('.examples').innerHTML=variants.map(([style,title,description],i)=>`<article class="${style}"><h2>${title}</h2><p class="description">${description}</p><div class="popup"><div class="heading">Tijdvak</div><div class="range">19 okt 2026, 00:00 – 20 okt 2026, 12:00</div><button type="button" class="default" aria-pressed="false">Standaard (12 uur)<span aria-hidden="true"></span></button><div class="tabs" role="tablist" aria-label="Soort tijdvak ${title[0]}">${['Afgelopen','Kalender','Eigen bereik'].map((label,n)=>`<button type="button" id="tab-${i}-${n}" role="tab" aria-selected="${n===1}" aria-controls="panel-${i}-${n}" tabindex="${n===1?0:-1}">${label}</button>`).join('')}</div><div class="panel" id="panel-${i}-0" role="tabpanel" aria-labelledby="tab-${i}-0" hidden><div class="options">${rolling.map(([short,long])=>`<button class="option" type="button" aria-label="${long}" title="${long}" aria-pressed="false">${short}</button>`).join('')}</div></div><div class="panel" id="panel-${i}-1" role="tabpanel" aria-labelledby="tab-${i}-1"><div class="options calendar">${calendar.map(label=>`<button class="option" type="button" aria-pressed="${label==='Deze week'}">${label}</button>`).join('')}</div></div><div class="panel" id="panel-${i}-2" role="tabpanel" aria-labelledby="tab-${i}-2" hidden><form><label>Begin<input type="datetime-local" value="2026-10-19T00:00" required></label><label>Einde<input type="datetime-local" value="2026-10-20T12:00" required></label><button type="submit" class="apply">Toepassen</button></form></div></div></article>`).join('');
document.querySelector('.theme').onclick=()=>document.body.classList.toggle('light');
for(const article of document.querySelectorAll('article')){
 const tabs=[...article.querySelectorAll('[role=tab]')],panels=[...article.querySelectorAll('[role=tabpanel]')],options=[...article.querySelectorAll('.option')];
 const selectTab=index=>{tabs.forEach((tab,n)=>{tab.setAttribute('aria-selected',String(n===index));tab.tabIndex=n===index?0:-1;panels[n].hidden=n!==index;});};
 const standard=article.querySelector('.default');
 const selectDefault=selected=>{standard.setAttribute('aria-pressed',String(selected));standard.lastElementChild.textContent=selected?'✓':'';};
 tabs.forEach((tab,n)=>{tab.onclick=()=>selectTab(n);tab.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const next=e.key==='Home'?0:e.key==='End'?2:(n+(e.key==='ArrowRight'?1:2))%3;selectTab(next);tabs[next].focus();};});
 options.forEach(button=>button.onclick=()=>{options.forEach(option=>option.setAttribute('aria-pressed',String(option===button)));selectDefault(false);});
 article.querySelector('.default').onclick=()=>{options.forEach(option=>option.setAttribute('aria-pressed','false'));selectTab(0);selectDefault(true);};
 article.querySelector('form').onsubmit=e=>{e.preventDefault();options.forEach(option=>option.setAttribute('aria-pressed','false'));selectDefault(false);};
}
</script></body></html>
